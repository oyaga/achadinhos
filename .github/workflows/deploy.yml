name: Build & Deploy

# A cada push na master: builda a imagem e publica no GitHub Container
# Registry (ghcr.io). O redeploy é best-effort via webhook do Portainer e
# finalizado manualmente com /root/achadinhos-redeploy.sh no servidor.

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/oyaga/achadinhos

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # necessário para publicar no ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Best-effort: dispara o webhook do Portainer se existir, mas NUNCA falha o job.
      # O webhook costuma não responder a tempo (e às vezes nem dispara o redeploy),
      # então o deploy é finalizado rodando /root/achadinhos-redeploy.sh no servidor.
      - name: Disparar redeploy no Portainer (best-effort)
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          set -uo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::notice::PORTAINER_WEBHOOK não configurado — redeploy pulado."
          else
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$WEBHOOK" || echo timeout)"
            echo "Webhook do Portainer: HTTP ${status}"
          fi
          echo "::notice::Imagem publicada no GHCR. Finalize o deploy rodando /root/achadinhos-redeploy.sh no servidor."
          exit 0

services:
  postgres:
    image: postgres:18-alpine
    container_name: achadinhos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-achadinhos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-achadinhos}
    volumes:
      - achadinhos_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-achadinhos} -d ${POSTGRES_DB:-achadinhos}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - achadinhos

  app:
    image: ghcr.io/oyaga/achadinhos:latest
    pull_policy: always
    container_name: achadinhos-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      # URL pública usada para montar links (ex.: e-mail da ficha de cadastro).
      APP_BASE_URL: ${APP_BASE_URL:-https://achadinhoscondominio.com.br}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-achadinhos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-achadinhos}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # E-mail transacional (Resend). Vazios desligam o envio de boas-vindas.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - achadinhos_uploads:/app/uploads
    networks:
      - achadinhos
      - traefik-public
    # Roteamento e TLS automático via Traefik (sem publicar porta no host).
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.achadinhos.rule=Host(`achadinhoscondominio.com.br`)"
      - "traefik.http.routers.achadinhos.entrypoints=websecure"
      - "traefik.http.routers.achadinhos.tls=true"
      - "traefik.http.routers.achadinhos.tls.certresolver=cloudflare"
      - "traefik.http.routers.achadinhos.middlewares=cloudflare-only@file,security-headers@file"
      - "traefik.http.services.achadinhos.loadbalancer.server.port=8080"
      # Watchtower: só este container é vigiado (auto-redeploy ao publicar :latest).
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  achadinhos_pgdata:
  achadinhos_uploads:

networks:
  achadinhos:
    driver: bridge
  # Rede compartilhada com o Traefik, criada pela stack de infraestrutura.
  traefik-public:
    external: true

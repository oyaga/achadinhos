services:
  postgres:
    image: postgres:18-alpine
    container_name: achadinhos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-achadinhos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-achadinhos}
    volumes:
      - achadinhos_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-achadinhos} -d ${POSTGRES_DB:-achadinhos}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - achadinhos

  app:
    image: oyaga/achadinhos:latest
    pull_policy: always
    container_name: achadinhos-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-achadinhos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-achadinhos}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - achadinhos_uploads:/app/uploads
    networks:
      - achadinhos

volumes:
  achadinhos_pgdata:
  achadinhos_uploads:

networks:
  achadinhos:
    driver: bridge
